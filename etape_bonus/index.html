<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TP4 - Etape Bonus</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body onload="init()">
    <div id="table_container">
    <div id="form_container">
        <div class="form_group"><label class="form_label" for="search_nom">🔍 Filtre (Nom):</label><input type="search" id="search_nom" oninput="filterByName()" class="form_field" style="margin-right:15px; border-color:#2196F3;"/></div>
        <div class="form_group"><label class="form_label" for="form_nom">Nom:</label><input type="text" id="form_nom" class="form_field"/></div>
        <div class="form_group"><label class="form_label" for="form_prenom">Prénom:</label><input type="text" id="form_prenom" class="form_field"/></div>
        <div class="form_group"><label class="form_label" for="form_points">Points:</label><input type="number" id="form_points" class="form_field"/></div>
        <button onclick="doNewData()" class="btn-add">Ajouter</button>
    </div>
        <table>
            <thead><tr><th>N°</th><th>Nom</th><th>Prénom</th><th>Points</th><th>Select</th></tr></thead>
            <tbody></tbody>
        </table>
        
    <div id="container_summary">
        <p id="p1">0 ligne(s)</p>
        <p id="p2"></p>
        <p id="p3">Total point(s)= 0</p>
    </div>
            <div id="container_btn">
        <button onclick="consoleTableau()" class="btn-consol">Console Tableau</button>
        <button onclick="deleteRow()" class="btn-del">Supprimer</button>
        <button onclick="clearAll()" class="btn-del" style="background:#ff9800;">Vider Tableau</button>
        <button onclick="highlightMax()" class="btn-consol" style="background:#9c27b0;">Surligner Max</button>
    </div>
    </div>
</body></html>
